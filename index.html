<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Data Mahasiswa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="badge">Praktikum Fullstack</div>
            <h1>Portal Data Mahasiswa</h1>
            <p>Kelola data akademik mahasiswa secara real-time dengan PHP &amp; MySQL</p>
        </header>

        <main class="main-grid">
            <section class="card form-card">
                <div class="card-header">
                    <h2 id="form-title">Tambah Mahasiswa</h2>
                    <span class="status-dot" title="Terhubung ke Localhost"></span>
                </div>

                <form id="mahasiswa-form">
                    <input type="hidden" id="mahasiswa-id">

                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" placeholder="Masukkan nama lengkap..." required autocomplete="off">
                    </div>

                    <div class="form-group">
                        <label for="nim">Nomor Induk Mahasiswa (NIM)</label>
                        <input type="text" id="nim" placeholder="Contoh: 23106050001" required autocomplete="off">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            Simpan Data
                        </button>
                        <button type="button" class="btn btn-secondary hidden" id="cancel-btn">
                            Batal Edit
                        </button>
                    </div>
                </form>
            </section>

            <section class="card table-card">
                <div class="card-header table-header">
                    <div>
                        <h2>Daftar Mahasiswa</h2>
                        <small id="total-data">Memuat data...</small>
                    </div>
                    <div class="search-box">
                        <input type="text" id="search-input" placeholder="Cari nama atau NIM...">
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Mahasiswa</th>
                                <th>NIM</th>
                                <th>Waktu Input</th>
                                <th class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="mahasiswa-list"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
